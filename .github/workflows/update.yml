name: Update Shadowrocket rules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "rules/**"
      - "scripts/**"
      - "tests/**"
  schedule:
    # 09:30 China / 10:30 Japan, after the upstream's daily 08:00 build.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shadowrocket-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build customized configuration
        run: python3 scripts/build.py

      - name: Verify generated configuration
        run: python3 -m unittest discover -s tests -v

      - name: Commit upstream changes
        shell: bash
        run: |
          if git diff --quiet -- dist/sr_proxy_banad_custom.conf; then
            echo "Upstream output is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sr_proxy_banad_custom.conf
          git commit -m "chore: update upstream Shadowrocket rules"
          git push
